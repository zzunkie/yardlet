name: Windows app

# The Windows app opened on a Windows runner (docs/PLATFORM_PORTABILITY.md, "The Windows app"): a
# release build, measured, with Korean typed into its composer through the Microsoft Korean IME and
# screenshots kept. It takes long, so it runs for the branches that port Yardlet to Windows and by
# hand; windows-engine.yml builds the app for every pull request.
on:
  push:
    branches: ['windows-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  open:
    name: Open the Windows app
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Allow long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Swift 6.4.1
        shell: pwsh
        run: Windows/scripts/install-swift.ps1 -Version 6.4.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Windows/Bindings/.work/swift-winrt-*
          key: swift-winrt-${{ hashFiles('Windows/Bindings/swift-winrt.json', 'Windows/Bindings/swift-winrt-patches/**') }}
      - name: Generate the WinUI bindings
        shell: pwsh
        run: Windows/scripts/generate-bindings.ps1
      - name: Build
        shell: pwsh
        run: |
          $started = Get-Date
          swift build -c release --product NativeHarnessClient --force-resolved-versions 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          "BUILD_SECONDS=$([math]::Round(((Get-Date) - $started).TotalSeconds))" | Add-Content $env:GITHUB_ENV
          if ($code -eq 0) { "APP_BIN=$(swift build -c release --show-bin-path)" | Add-Content $env:GITHUB_ENV }
          exit $code
      - name: Place the bootstrapper
        shell: pwsh
        run: Windows/scripts/place-bootstrapper.ps1 -Binaries $env:APP_BIN
      - name: Install the Windows App Runtime 1.7
        shell: pwsh
        run: Windows/scripts/install-windows-app-runtime.ps1 -Url https://aka.ms/windowsappsdk/1.7/1.7.250909003/windowsappruntimeinstall-x64.exe
      - name: Open the app
        shell: powershell
        run: Windows/scripts/check-window.ps1 -Executable "$env:APP_BIN\NativeHarnessClient.exe" -Name app -OutDirectory window-check
      - name: Report
        if: always()
        shell: pwsh
        run: Windows/scripts/report.ps1 -Name app -BuildLog build.log -Seconds $env:BUILD_SECONDS -OutDirectory window-check -Binaries $env:APP_BIN
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-app
          path: |
            window-check
            build.log
          if-no-files-found: ignore

  # How code swift-winrt generates behaves at run time (Windows/Probes/SwiftWinRT).
  probe:
    name: Probe swift-winrt
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Allow long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Swift 6.4.1
        shell: pwsh
        run: Windows/scripts/install-swift.ps1 -Version 6.4.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Windows/Bindings/.work/swift-winrt-*
          key: swift-winrt-${{ hashFiles('Windows/Bindings/swift-winrt.json', 'Windows/Bindings/swift-winrt-patches/**') }}
      - name: Generate the WinUI bindings
        shell: pwsh
        run: Windows/scripts/generate-bindings.ps1
      - name: Install the Windows App Runtime 1.7
        shell: pwsh
        run: Windows/scripts/install-windows-app-runtime.ps1 -Url https://aka.ms/windowsappsdk/1.7/1.7.250909003/windowsappruntimeinstall-x64.exe
      - name: Run the probe
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'swift-winrt-probe.txt'
          Windows/scripts/run-swift-winrt-probe.ps1 -Output $output 2>&1 | Tee-Object -FilePath probe.log
          if (Test-Path $output) {
            $text = ((Get-Content $output) -join "`n") -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Output "::notice title=swift-winrt probe::$text"
          }
      - name: Report a failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path probe.log) {
            $text = ((Get-Content probe.log -Tail 60) -join "`n") -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Output "::notice title=probe log::$text"
          }
