name: Windows app

# The Windows app opened on a Windows runner (docs/PLATFORM_PORTABILITY.md, "The Windows app"): a
# release build, measured, with Korean typed into its composer through the Microsoft Korean IME and
# screenshots kept. It takes long, so it runs for the branches that port Yardlet to Windows and by
# hand; windows-engine.yml builds the app for every pull request.
on:
  push:
    branches: ['windows-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  open:
    name: Open the Windows app
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Allow long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Swift 6.4.1
        shell: pwsh
        run: Windows/scripts/install-swift.ps1 -Version 6.4.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Windows/Bindings/.work/swift-winrt-*
          key: swift-winrt-${{ hashFiles('Windows/Bindings/swift-winrt.json', 'Windows/Bindings/swift-winrt-patches/**') }}
      - name: Generate the WinUI bindings
        shell: pwsh
        run: Windows/scripts/generate-bindings.ps1
      - name: Build
        shell: pwsh
        run: |
          $started = Get-Date
          swift build -c release --product NativeHarnessClient --force-resolved-versions 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          "BUILD_SECONDS=$([math]::Round(((Get-Date) - $started).TotalSeconds))" | Add-Content $env:GITHUB_ENV
          if ($code -eq 0) { "APP_BIN=$(swift build -c release --show-bin-path)" | Add-Content $env:GITHUB_ENV }
          exit $code
      - name: Place the bootstrapper
        shell: pwsh
        run: Windows/scripts/place-bootstrapper.ps1 -Binaries $env:APP_BIN
      - name: Install the Windows App Runtime 2.6
        shell: pwsh
        run: Windows/scripts/install-windows-app-runtime.ps1 -Url https://aka.ms/windowsappsdk/2.6/2.6.5/windowsappruntimeinstall-x64.exe
      - name: Open the app
        shell: powershell
        run: Windows/scripts/check-window.ps1 -Executable "$env:APP_BIN\NativeHarnessClient.exe" -Name app -OutDirectory window-check
      # The remote client against a host it can reach on the runner: the relay run locally and the fixture
      # host on it (docs/REMOTE_PROTOCOL.md, "Fixture server" and "Relay").
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # A Windows runner ends the programs a step started when the step ends, so the host starts in the step that
      # connects to it.
      - name: Connect to the fixture host
        shell: pwsh
        run: |
          npm ci --prefix relay
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          swift build -c release --product yardlet-remote-fixture --force-resolved-versions
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Windows/scripts/start-remote-host.ps1 -Fixture "$env:APP_BIN\yardlet-remote-fixture.exe" -OutDirectory window-check
          $link = Get-Content window-check/pairing-link.txt
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File Windows/scripts/check-remote.ps1 `
            -Executable "$env:APP_BIN\NativeHarnessClient.exe" -Link $link -OutDirectory window-check
          exit $LASTEXITCODE
      # A harness installed the way npm installs one: the app finds its shim, starts it for its version and the
      # ACP handshake, and stopping it also ends a process it started (docs/PLATFORM_PORTABILITY.md, "The
      # Windows app"). The stand-in's processes end with the step, so they start in the step that checks them.
      - name: Start a harness installed with npm
        shell: pwsh
        run: Windows/scripts/check-harness.ps1 -Executable "$env:APP_BIN\NativeHarnessClient.exe" -OutDirectory window-check
      # The stand-in the step before installed, in a task of its own: started from New task, its request
      # allowed from its card, its edit opened to its diff, its answer streamed in and kept when the app opens
      # again, and a second turn stopped with Stop through ACP's session/cancel, the stand-in still running.
      - name: Start a task with the stand-in harness
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File Windows/scripts/check-local.ps1 `
            -Executable "$env:APP_BIN\NativeHarnessClient.exe" -OutDirectory window-check
          exit $LASTEXITCODE
      # That task served to phones on the engine's client connection, one over the app's direct listener and one
      # through the relay: Settings > Remote turned on, each paired with a link it copies, the task listed, a message
      # answered, the phones listed, and the listener and the room closed once off.
      - name: Serve the app's tasks to a phone
        shell: pwsh
        run: |
          Windows/scripts/start-remote-host.ps1 -OutDirectory window-check -Name serve
          # The local relay, built in as a build carries its relay, beside the app the check opens.
          $env:YARDLET_RELAY_URL = 'ws://127.0.0.1:8787'
          Windows/scripts/place-relay.ps1 -Destination $env:APP_BIN
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File Windows/scripts/check-remote-host.ps1 `
            -Executable "$env:APP_BIN\NativeHarnessClient.exe" -Fixture "$env:APP_BIN\yardlet-remote-fixture.exe" `
            -OutDirectory window-check
          exit $LASTEXITCODE
      # The app with the Swift runtime beside it, to run on a PC that has the Windows App Runtime 2.6 but no
      # Swift: its executable, libraries and resource folder, as report.ps1 counts them, without the fixture host
      # the build made beside it.
      - name: Gather the app
        shell: pwsh
        # The relay a public build carries (scripts/release.sh), for the PC the gathered app is opened on.
        env:
          YARDLET_RELAY_URL: https://relay.yardlet.app
        run: |
          $out = New-Item -ItemType Directory -Force windows-app-bin
          Get-ChildItem $env:APP_BIN -File |
            Where-Object { $_.Name -eq 'NativeHarnessClient.exe' -or $_.Extension -in '.dll', '.pri', '.winmd' } |
            Copy-Item -Destination $out
          Get-ChildItem $env:APP_BIN -Directory | Where-Object Name -match 'resources|bundle' |
            Copy-Item -Destination $out -Recurse
          $runtime = Get-ChildItem "$env:LOCALAPPDATA\Programs\Swift\Runtimes\*\usr\bin" -Directory | Select-Object -First 1
          Copy-Item "$runtime\*.dll" $out
          Windows/scripts/place-relay.ps1 -Destination $out
          Get-ChildItem $out -Recurse -File | Measure-Object -Property Length -Sum | ForEach-Object { "$($_.Count) files, $([math]::Round($_.Sum / 1MB, 1)) MB" }
          Get-ChildItem $out -Directory | ForEach-Object { "folder: $($_.Name)" }
      # What was gathered opens on its own: copied elsewhere, with the build folder out of reach, so the app
      # finds nothing it needs where it was built.
      - name: Open the gathered app
        shell: pwsh
        run: |
          $copy = Join-Path $env:RUNNER_TEMP 'yardlet-app'
          Copy-Item windows-app-bin $copy -Recurse
          Rename-Item .build .build-hidden
          try {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File Windows/scripts/check-window.ps1 `
              -Executable (Join-Path $copy 'NativeHarnessClient.exe') -Name gathered -OutDirectory window-check
            $code = $LASTEXITCODE
          } finally {
            Rename-Item .build-hidden .build
          }
          exit $code
      # The app packed with Velopack, installed without a window, updated from a feed in a folder on the runner
      # and removed (docs/PLATFORM_PORTABILITY.md, "Installing and updating the Windows app").
      - name: Install, update and remove the packed app
        shell: pwsh
        env:
          YARDLET_RELAY_URL: https://relay.yardlet.app
        run: Windows/scripts/check-install.ps1 -Binaries $env:APP_BIN -OutDirectory window-check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-app-setup
          path: ${{ runner.temp }}/yardlet-pack-first
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-app-bin
          path: windows-app-bin
          retention-days: 7
      - name: Report
        if: always()
        shell: pwsh
        run: Windows/scripts/report.ps1 -Name app -BuildLog build.log -Seconds $env:BUILD_SECONDS -OutDirectory window-check -Binaries $env:APP_BIN
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-app
          path: |
            window-check
            build.log
          if-no-files-found: ignore
