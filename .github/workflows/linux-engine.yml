name: Linux engine

# The engine built on its own on Linux (docs/PLATFORM_PORTABILITY.md, "Building the engine on its own"),
# for every pull request that changes more than documents and for main, as windows-engine.yml builds it
# on Windows. It informs and is not a required check: a pull request that breaks it can still be merged.
on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - '**/*.md'
      - LICENSE
  pull_request:
    paths-ignore:
      - docs/**
      - '**/*.md'
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # As in ci.yml: a commit a pull request's run already built is not built again when it lands.
  tested-in-pull-request:
    name: Look for a passing pull request run
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.find.outputs.passed }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/linux-engine.yml/runs?event=pull_request&status=success&head_sha=$GITHUB_SHA&per_page=1" --jq .total_count) || runs=0
          if [[ $runs -gt 0 ]]; then echo "passed=true" >> "$GITHUB_OUTPUT"; fi

  build:
    name: Build the engine on Linux
    needs: tested-in-pull-request
    if: ${{ !cancelled() && needs.tested-in-pull-request.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # swift.org's official image, pinned by digest, as the portability notes build it.
    container: swift:6.4.2-bookworm@sha256:ba9cf5581a1e3995eea88826033863114e2dbca8c0e7f6af1988d7cbb3fdce40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the toolchain
        run: swift --version
      # The compiler's errors also go to the run's summary and, on failure, to the check run's
      # annotations, which the API gives without a sign-in.
      - name: Build
        shell: bash
        env:
          YARDLET_ENGINE_ONLY: "1"
        run: |
          # Actions runs bash with -e and pipefail; keep going to gather the errors, then exit with the build's code.
          set +e +o pipefail
          swift build --target NativeHarnessClient --force-resolved-versions -Xswiftc -continue-building-after-errors 2>&1 |
            tee build.log
          code=${PIPESTATUS[0]}
          errors=$(sed -e 's/\x1b\[[0-9;]*m//g' build.log | grep -E 'error:' | sort -u | head -200 || true)
          if [[ -n $errors ]]; then
            { echo '### Build errors'; echo '```'; echo "$errors"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do echo "::notice title=Build error::$line"; done <<< "$(echo "$errors" | head -50)"
          fi
          exit "$code"
