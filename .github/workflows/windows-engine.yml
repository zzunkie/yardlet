name: Windows engine

# The engine built on its own on Windows (docs/PLATFORM_PORTABILITY.md, "Building the engine on its
# own"), and the Windows app built on it ("The Windows app"), for every pull request, main and the
# branches that port it. They inform and are not required checks: a pull request that breaks them can
# still be merged.
on:
  push:
    branches: [main, 'windows-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the engine
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Allow long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # swift.org's own installer, signed by its publisher. The repository allows only GitHub's and its
      # own actions, so no setup action installs it.
      - name: Install Swift 6.4.1
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'swift.exe'
          Invoke-WebRequest -Uri 'https://download.swift.org/swift-6.4.1-release/windows10/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE-windows10.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature $installer
          Write-Output "Signed by: $($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne 'Valid') { throw "The installer's signature is $($signature.Status)" }
          $process = Start-Process -Wait -PassThru -FilePath $installer -ArgumentList '/quiet', '/norestart', '/log', (Join-Path $env:RUNNER_TEMP 'swift-install.log')
          if ($process.ExitCode -ne 0) { throw "The installer ended with $($process.ExitCode)" }
          # The installer writes Path and SDKROOT for later shells; hand them to the next steps.
          foreach ($scope in 'Machine', 'User') {
            $path = [Environment]::GetEnvironmentVariable('Path', $scope)
            if ($path) { $path -split ';' | Where-Object { $_ -match 'Swift' } | Add-Content $env:GITHUB_PATH }
            $sdk = [Environment]::GetEnvironmentVariable('SDKROOT', $scope)
            if ($sdk) { "SDKROOT=$sdk" | Add-Content $env:GITHUB_ENV }
          }
      - name: Show the toolchain
        run: swift --version
      # The compiler's errors also go to the run's summary, which anyone can read.
      - name: Build
        shell: pwsh
        env:
          YARDLET_ENGINE_ONLY: "1"
        run: |
          swift build --target NativeHarnessClient --force-resolved-versions -Xswiftc -continue-building-after-errors 2>&1 |
            Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          $errors = Select-String -Path build.log -Pattern 'error:' | ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique
          if ($errors) {
            "### Build errors`n" | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
            $errors | Select-Object -First 200 | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          exit $code
      # Without signing in, a run's logs and summary cannot be read, but its annotations can (the check
      # run's annotations in the API): say there what went wrong.
      - name: Report a failure
        if: failure()
        shell: pwsh
        run: |
          function Report([string] $title, [string[]] $lines) {
            $text = ($lines -join "`n") -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Output "::notice title=$title::$text"
          }
          $swift = Get-Command swift -ErrorAction SilentlyContinue
          $toolchain = @(
            "swift: " + $(if ($swift) { $swift.Source } else { 'not on PATH' }),
            "SDKROOT=$env:SDKROOT"
          )
          foreach ($scope in 'Machine', 'User') {
            $toolchain += "$scope Path (Swift): " + (([Environment]::GetEnvironmentVariable('Path', $scope) -split ';' | Where-Object { $_ -match 'Swift' }) -join '; ')
          }
          Report 'Toolchain' $toolchain
          $install = Join-Path $env:RUNNER_TEMP 'swift-install.log'
          if (Test-Path $install) { Report 'Installer log' (Get-Content $install -Tail 40) }
          if (Test-Path build.log) {
            Report 'Build errors' (Select-String -Path build.log -Pattern 'error:' | ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique | Select-Object -First 150)
            Report 'Build log' (Get-Content build.log -Tail 60)
          }

  # The Windows app: the engine, Platform/Windows and the WinUI screens, on WinUI bindings generated
  # first. A debug build, which shows whether the app compiles without a release's optimizer time.
  app:
    name: Build the Windows app
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Allow long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Swift 6.4.1
        shell: pwsh
        run: Windows/scripts/install-swift.ps1 -Version 6.4.1
      # swift-winrt, built from the commit Windows/Bindings/swift-winrt.json pins.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Windows/Bindings/.work/swift-winrt-*
          key: swift-winrt-${{ hashFiles('Windows/Bindings/swift-winrt.json') }}
      - name: Generate the WinUI bindings
        shell: pwsh
        run: Windows/scripts/generate-bindings.ps1 2>&1 | Tee-Object -FilePath generate.log
      - name: Build
        shell: pwsh
        run: |
          swift build --product NativeHarnessClient --force-resolved-versions -Xswiftc -continue-building-after-errors 2>&1 |
            Tee-Object -FilePath build.log
          exit $LASTEXITCODE
      - name: Report a failure
        if: failure()
        shell: pwsh
        run: |
          function Report([string] $title, [string[]] $lines) {
            $text = ($lines -join "`n") -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Output "::notice title=$title::$text"
          }
          if (Test-Path generate.log) { Report 'Generation log' (Get-Content generate.log -Tail 40) }
          if (Test-Path build.log) {
            Report 'App build errors' (Select-String -Path build.log -Pattern 'error:' | ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique | Select-Object -First 150)
            Report 'App build log' (Get-Content build.log -Tail 60)
          }
