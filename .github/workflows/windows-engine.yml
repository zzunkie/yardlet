name: Windows engine

# The engine built on its own on Windows (docs/PLATFORM_PORTABILITY.md, "Building the engine on its
# own"), and the Windows app built on it ("The Windows app"), for every pull request that changes more
# than documents, main and the branches that port it. They inform and are not required checks: a pull
# request that breaks them can still be merged.
on:
  push:
    branches: [main, 'windows-*']
    paths-ignore:
      - docs/**
      - '**/*.md'
      - LICENSE
  pull_request:
    paths-ignore:
      - docs/**
      - '**/*.md'
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # As in ci.yml: a commit a pull request's run already built is not built again when it lands.
  tested-in-pull-request:
    name: Look for a passing pull request run
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.find.outputs.passed }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/windows-engine.yml/runs?event=pull_request&status=success&head_sha=$GITHUB_SHA&per_page=1" --jq .total_count) || runs=0
          if [[ $runs -gt 0 ]]; then echo "passed=true" >> "$GITHUB_OUTPUT"; fi

  build:
    name: Build the engine
    needs: tested-in-pull-request
    if: ${{ !cancelled() && needs.tested-in-pull-request.outputs.passed != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Allow long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Swift 6.4.1
        shell: pwsh
        run: Windows/scripts/install-swift.ps1 -Version 6.4.1
      - name: Show the toolchain
        run: swift --version
      # The compiler's errors also go to the run's summary, which anyone can read.
      - name: Build
        shell: pwsh
        env:
          YARDLET_ENGINE_ONLY: "1"
        run: |
          swift build --target NativeHarnessClient --force-resolved-versions -Xswiftc -continue-building-after-errors 2>&1 |
            Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          $errors = Select-String -Path build.log -Pattern 'error:' | ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique
          if ($errors) {
            "### Build errors`n" | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
            $errors | Select-Object -First 200 | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          exit $code
      # Without signing in, a run's logs and summary cannot be read, but its annotations can (the check
      # run's annotations in the API): say there what went wrong.
      - name: Report a failure
        if: failure()
        shell: pwsh
        run: |
          function Report([string] $title, [string[]] $lines) {
            $text = ($lines -join "`n") -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Output "::notice title=$title::$text"
          }
          $swift = Get-Command swift -ErrorAction SilentlyContinue
          $toolchain = @(
            "swift: " + $(if ($swift) { $swift.Source } else { 'not on PATH' }),
            "SDKROOT=$env:SDKROOT"
          )
          foreach ($scope in 'Machine', 'User') {
            $toolchain += "$scope Path (Swift): " + (([Environment]::GetEnvironmentVariable('Path', $scope) -split ';' | Where-Object { $_ -match 'Swift' }) -join '; ')
          }
          Report 'Toolchain' $toolchain
          $install = Join-Path $env:RUNNER_TEMP 'swift-install.log'
          if (Test-Path $install) { Report 'Installer log' (Get-Content $install -Tail 40) }
          if (Test-Path build.log) {
            Report 'Build errors' (Select-String -Path build.log -Pattern 'error:' | ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique | Select-Object -First 150)
            Report 'Build log' (Get-Content build.log -Tail 60)
          }

  # The Windows app: the engine, Platform/Windows and the WinUI screens, on WinUI bindings generated
  # first. A debug build, which shows whether the app compiles without a release's optimizer time.
  app:
    name: Build the Windows app
    needs: tested-in-pull-request
    if: ${{ !cancelled() && needs.tested-in-pull-request.outputs.passed != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Allow long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Swift 6.4.1
        shell: pwsh
        run: Windows/scripts/install-swift.ps1 -Version 6.4.1
      # swift-winrt, built from the commit Windows/Bindings/swift-winrt.json pins.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Windows/Bindings/.work/swift-winrt-*
          key: swift-winrt-${{ hashFiles('Windows/Bindings/swift-winrt.json', 'Windows/Bindings/swift-winrt-patches/**') }}
      - name: Generate the WinUI bindings
        shell: pwsh
        run: Windows/scripts/generate-bindings.ps1 2>&1 | Tee-Object -FilePath generate.log
      # As in ci.yml, the run starts from main's latest build of the app and its tests (the build-cache job
      # below) and compiles what changed since then. The tracked sources and the generated bindings are
      # dated by their content (scripts/source-times.py); the runner's image and Swift's version name the
      # build, so an image with another Windows SDK builds from scratch.
      - name: Name the toolchain
        id: toolchain
        shell: pwsh
        run: '"id=${env:ImageOS}-${env:ImageVersion}-swift-6.4.1" | Add-Content $env:GITHUB_OUTPUT'
      - name: Start from main's build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: windows-debug-${{ steps.toolchain.outputs.id }}-${{ github.sha }}
          restore-keys: windows-debug-${{ steps.toolchain.outputs.id }}-
      - name: Date the sources by their content
        run: python -I scripts/source-times.py Windows/Bindings/Generated
      - name: Build
        shell: pwsh
        run: |
          swift build --product NativeHarnessClient --force-resolved-versions -Xswiftc -continue-building-after-errors 2>&1 |
            Tee-Object -FilePath build.log
          exit $LASTEXITCODE
      # The Windows layer's own tests (Tests/YardletWindowsTests), built against the app (YARDLET_WINDOWS_TESTS in
      # Package.swift). The test program links the Windows App SDK's bootstrapper as the app does, so the bootstrapper
      # goes beside it.
      - name: Test the Windows layer
        shell: pwsh
        env:
          YARDLET_WINDOWS_TESTS: "1"
        run: |
          swift build --build-tests --force-resolved-versions -Xswiftc -continue-building-after-errors 2>&1 |
            Tee-Object -FilePath test-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Windows/scripts/place-bootstrapper.ps1 -Binaries (swift build --show-bin-path)
          swift test --skip-build --force-resolved-versions --filter YardletWindowsTests 2>&1 | Tee-Object -FilePath test.log
          exit $LASTEXITCODE
      - name: Report a failure
        if: failure()
        shell: pwsh
        run: |
          function Report([string] $title, [string[]] $lines) {
            $text = ($lines -join "`n") -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Output "::notice title=$title::$text"
          }
          if (Test-Path generate.log) { Report 'Generation log' (Get-Content generate.log -Tail 40) }
          if (Test-Path build.log) {
            Report 'App build errors' (Select-String -Path build.log -Pattern 'error:' | ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique | Select-Object -First 150)
            Report 'App build log' (Get-Content build.log -Tail 60)
          }
          if (Test-Path test-build.log) {
            Report 'Test build errors' (Select-String -Path test-build.log -Pattern 'error:' | ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique | Select-Object -First 150)
          }
          if (Test-Path test.log) {
            Report 'Test failures' (Select-String -Path test.log -Pattern 'error|failed' | ForEach-Object { $_.Line.Trim() } | Select-Object -First 100)
            Report 'Test log' (Get-Content test.log -Tail 60)
          }

  # main's debug build of the Windows app and its tests, kept for each commit that reaches main for the app
  # job above to start from, as ci.yml keeps the Mac's. By hand, it keeps the build of the branch it ran on.
  build-cache:
    name: Keep main's build of the Windows app
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Allow long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Swift 6.4.1
        shell: pwsh
        run: Windows/scripts/install-swift.ps1 -Version 6.4.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Windows/Bindings/.work/swift-winrt-*
          key: swift-winrt-${{ hashFiles('Windows/Bindings/swift-winrt.json', 'Windows/Bindings/swift-winrt-patches/**') }}
      - name: Generate the WinUI bindings
        shell: pwsh
        run: Windows/scripts/generate-bindings.ps1
      - name: Name the toolchain
        id: toolchain
        shell: pwsh
        run: '"id=${env:ImageOS}-${env:ImageVersion}-swift-6.4.1" | Add-Content $env:GITHUB_OUTPUT'
      - name: Start from the last build kept
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: windows-debug-${{ steps.toolchain.outputs.id }}-${{ github.sha }}
          restore-keys: windows-debug-${{ steps.toolchain.outputs.id }}-
      - name: Date the sources by their content
        run: python -I scripts/source-times.py Windows/Bindings/Generated
      # The two builds the app job makes, in its order.
      - name: Build
        shell: pwsh
        run: |
          swift build --product NativeHarnessClient --force-resolved-versions
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:YARDLET_WINDOWS_TESTS = '1'
          swift build --build-tests --force-resolved-versions
          exit $LASTEXITCODE
      - name: Keep the build
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: windows-debug-${{ steps.toolchain.outputs.id }}-${{ github.sha }}
