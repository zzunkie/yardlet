name: Windows engine

# The engine built on its own on Windows (docs/PLATFORM_PORTABILITY.md, "Building the engine on its
# own"). It runs for the branches that port it and by hand, apart from the checks a pull request needs,
# until the engine builds there.
on:
  push:
    branches: ['windows-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the engine
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Allow long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # swift.org's own installer, signed by its publisher. The repository allows only GitHub's and its
      # own actions, so no setup action installs it.
      - name: Install Swift 6.4.1
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'swift.exe'
          Invoke-WebRequest -Uri 'https://download.swift.org/swift-6.4.1-release/windows10/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE-windows10.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature $installer
          Write-Output "Signed by: $($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne 'Valid') { throw "The installer's signature is $($signature.Status)" }
          $process = Start-Process -Wait -PassThru -FilePath $installer -ArgumentList '/quiet', '/norestart'
          if ($process.ExitCode -ne 0) { throw "The installer ended with $($process.ExitCode)" }
          # The installer writes Path and SDKROOT for later shells; hand them to the next steps.
          foreach ($scope in 'Machine', 'User') {
            $path = [Environment]::GetEnvironmentVariable('Path', $scope)
            if ($path) { $path -split ';' | Where-Object { $_ -match 'Swift' } | Add-Content $env:GITHUB_PATH }
            $sdk = [Environment]::GetEnvironmentVariable('SDKROOT', $scope)
            if ($sdk) { "SDKROOT=$sdk" | Add-Content $env:GITHUB_ENV }
          }
      - name: Show the toolchain
        run: swift --version
      - name: Build
        env:
          YARDLET_ENGINE_ONLY: "1"
        run: swift build --target NativeHarnessClient --force-resolved-versions -Xswiftc -continue-building-after-errors
