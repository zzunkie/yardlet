name: Windows engine

# The engine built on its own on Windows (docs/PLATFORM_PORTABILITY.md, "Building the engine on its
# own"). It runs for the branches that port it and by hand, apart from the checks a pull request needs,
# until the engine builds there.
on:
  push:
    branches: ['windows-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the engine
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Allow long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # swift.org's own installer, signed by its publisher. The repository allows only GitHub's and its
      # own actions, so no setup action installs it.
      - name: Install Swift 6.4.1
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'swift.exe'
          Invoke-WebRequest -Uri 'https://download.swift.org/swift-6.4.1-release/windows10/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE-windows10.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature $installer
          Write-Output "Signed by: $($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne 'Valid') { throw "The installer's signature is $($signature.Status)" }
          $process = Start-Process -Wait -PassThru -FilePath $installer -ArgumentList '/quiet', '/norestart', '/log', (Join-Path $env:RUNNER_TEMP 'swift-install.log')
          if ($process.ExitCode -ne 0) { throw "The installer ended with $($process.ExitCode)" }
          # The installer writes Path and SDKROOT for later shells; hand them to the next steps.
          foreach ($scope in 'Machine', 'User') {
            $path = [Environment]::GetEnvironmentVariable('Path', $scope)
            if ($path) { $path -split ';' | Where-Object { $_ -match 'Swift' } | Add-Content $env:GITHUB_PATH }
            $sdk = [Environment]::GetEnvironmentVariable('SDKROOT', $scope)
            if ($sdk) { "SDKROOT=$sdk" | Add-Content $env:GITHUB_ENV }
          }
      - name: Show the toolchain
        run: swift --version
      # The compiler's errors also go to the run's summary, which anyone can read.
      - name: Build
        shell: pwsh
        env:
          YARDLET_ENGINE_ONLY: "1"
        run: |
          swift build --target NativeHarnessClient --force-resolved-versions -Xswiftc -continue-building-after-errors 2>&1 |
            Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          $errors = Select-String -Path build.log -Pattern 'error:' | ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique
          if ($errors) {
            "### Build errors`n" | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
            $errors | Select-Object -First 200 | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          exit $code
      # Without signing in, a run's logs cannot be read, but its summary can: say there what went wrong.
      - name: Summarize a failure
        if: failure()
        shell: pwsh
        run: |
          $summary = $env:GITHUB_STEP_SUMMARY
          "### Toolchain" | Add-Content $summary
          '```' | Add-Content $summary
          (Get-Command swift -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source) ?? 'swift: not on PATH' | Add-Content $summary
          "SDKROOT=$env:SDKROOT" | Add-Content $summary
          foreach ($scope in 'Machine', 'User') {
            "$scope Path (Swift): " + (([Environment]::GetEnvironmentVariable('Path', $scope) -split ';' | Where-Object { $_ -match 'Swift' }) -join '; ') | Add-Content $summary
          }
          '```' | Add-Content $summary
          $install = Join-Path $env:RUNNER_TEMP 'swift-install.log'
          if (Test-Path $install) {
            "### Installer log (last 40 lines)" | Add-Content $summary
            '```' | Add-Content $summary
            Get-Content $install -Tail 40 | Add-Content $summary
            '```' | Add-Content $summary
          }
          if (Test-Path build.log) {
            "### Build log (last 80 lines)" | Add-Content $summary
            '```' | Add-Content $summary
            Get-Content build.log -Tail 80 | Add-Content $summary
            '```' | Add-Content $summary
          }
