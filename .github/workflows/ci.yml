name: CI

# Documents and other platforms' own folders run nothing: no macOS build or test reads them, and
# `main` requires no check for a pull request to wait on.
on:
  push:
    branches: [main]
    paths-ignore: &ci-ignore
      - docs/**
      - '**/*.md'
      - LICENSE
      - Apps/iOS/**
      - Windows/**
      - relay/**
      - scripts/linux/**
      - Sources/CSQLiteWindows/**
      - Tests/YardletHostTests/**
      - Tests/YardletWindowsTests/**
      - .github/workflows/ios.yml
      - .github/workflows/relay.yml
      - .github/workflows/linux-host.yml
      - .github/workflows/linux-engine.yml
      - .github/workflows/windows-engine.yml
      - .github/workflows/windows-app.yml
      - .github/workflows/swift-winrt-tests.yml
      - .github/workflows/launch.yml
      - .github/workflows/full-tests.yml
  pull_request:
    paths-ignore: *ci-ignore
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request lands by fast-forwarding `main` to the commit its run tested, so building that commit
  # again here repeats the run. The same commit means the same tree: `main` never rewinds, so the commit
  # contains the `main` that run merged it with. Anything that reaches `main` another way (a merge button,
  # a rebase, a direct push) has a new SHA, finds no run and is built. With the build skipped the run
  # still passes, so the README's badge goes on saying whether `main` passed.
  tested-in-pull-request:
    name: Look for a passing pull request run
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.find.outputs.passed }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&status=success&head_sha=$GITHUB_SHA&per_page=1" --jq .total_count) || runs=0
          if [[ $runs -gt 0 ]]; then echo "passed=true" >> "$GITHUB_OUTPUT"; fi

  build-and-test:
    name: Build and test
    needs: tested-in-pull-request
    # `!cancelled()` lets this run when the job above is skipped, as on a pull request.
    if: ${{ !cancelled() && needs.tested-in-pull-request.outputs.passed != 'true' }}
    # Yardlet builds with Xcode 27.1 (Swift 6.4); Xcode 26 cannot compile it.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Pull requests check out a merge commit whose first parent is the base branch, which
          # lets stack-scope inspect the PR diff without an extra fetch.
          fetch-depth: 2
      - name: Show the toolchain
        id: toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          echo "id=$({ xcodebuild -version; swift --version; } 2>&1 | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      # The run starts from main's latest build (the build-cache job below), so it compiles what changed
      # since then rather than every file. The sources are dated by their content, which is how that
      # build tells a file it compiled from a changed one after a fresh checkout. With no build kept for
      # this toolchain, the run builds from scratch.
      - name: Start from main's build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: macos-debug-${{ steps.toolchain.outputs.id }}-${{ github.sha }}
          restore-keys: macos-debug-${{ steps.toolchain.outputs.id }}-
      - name: Restore test timing hints
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/xctest-times.tsv
            .build/xctest-stack-times.tsv
          key: xctest-times-${{ github.sha }}
          restore-keys: xctest-times-
      - name: Date the sources by their content
        run: python3 -I scripts/source-times.py
      # A compiler warning in a product target fails the run. This build compiles the product files
      # that changed since main's build, and those that depend on them, and prints their warnings: the
      # rest compiled without one when they reached main. The test target is built by the step after
      # this one, and its warnings are not counted.
      - name: Build
        run: |
          set -o pipefail
          mkdir -p .build/ci
          swift build --build-system native 2>&1 | tee .build/ci/build.log
          ./scripts/product-warnings.sh .build/ci/build.log
      # `-v` keeps every test's XCTest output: its time and, when skipped, why. test-report.py shows
      # only the failed tests' output here and writes the rest to the run's summary and an artifact.
      - name: Test
        run: |
          set -o pipefail
          mkdir -p .build/ci
          ./scripts/test-fast.sh -v 2>&1 | python3 -I scripts/test-report.py --log .build/ci/test-output.log \
            --times .build/ci/test-times.tsv --summary "$GITHUB_STEP_SUMMARY"
      # While the eager stack can still be turned back on in place of the conversation's row list
      # (ConversationRowListSwitch), the conversation's tests run again with the stack on pushes to main,
      # manual runs, and pull requests that change conversation views, projections, transcripts, or the
      # stack test scripts. Unrelated pull requests skip this extra ~4-minute pass. It goes away with the stack.
      - name: Check whether the conversation's stack changed
        id: stack-scope
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse --verify -q HEAD^2 >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          pattern='^(Sources/NativeHarnessClient/(Views/Conversation/|Views/ConversationFindBar\.swift$|Views/TranscriptReadingPosition\.swift$|Views/SentUserMessage\.swift$|Views/AppShell/TaskSurface\.swift$|Views/HarnessSubtaskPane\.swift$|Presentation/Conversation/|Presentation/Codex/|Presentation/ConversationFind\.swift$|Transcript/)|Tests/NativeHarnessClientTests/(Conversation|Transcript|CodexTimeline|StreamingWindowRedraw|TaskWorkspaceRestoration)|scripts/(test-conversation-stack\.sh|xctest-batches\.py)$|\.github/workflows/ci\.yml$|Package\.(swift|resolved)$)'
          if grep -Eq "$pattern" <<< "$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping eager conversation stack tests: no conversation view, projection, or stack-test files changed."
          fi
      - name: Test the conversation's stack
        if: steps.stack-scope.outputs.run == 'true'
        run: |
          set -o pipefail
          ./scripts/test-conversation-stack.sh --skip-build -v 2>&1 | python3 -I scripts/test-report.py \
            --log .build/ci/conversation-stack-output.log --times .build/ci/conversation-stack-times.tsv \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Save test timing hints
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/xctest-times.tsv
            .build/xctest-stack-times.tsv
          key: xctest-times-${{ github.sha }}
      - name: Keep the test output and times
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            .build/ci/test-output.log
            .build/ci/test-times.tsv
            .build/ci/conversation-stack-output.log
            .build/ci/conversation-stack-times.tsv
          retention-days: 14
          if-no-files-found: ignore
      - name: Keep the images the tests drew
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-images
          path: |
            .build/*/*.png
            .build/*/*/*.png
            !.build/checkouts/**
            !.build/arm64-apple-macosx/**
            !.build/x86_64-apple-macosx/**
          retention-days: 14
          if-no-files-found: ignore

  # main's build, products and tests, kept in GitHub's cache for each commit that reaches main, for the
  # runs above to start from. The repository keeps 10 GB of caches and drops the least recently used
  # first; a pull request's run only reads them. By hand, it keeps the build of the branch it ran on,
  # which only that branch's runs read.
  build-cache:
    name: Keep main's build for pull requests
    if: github.event_name != 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Name the toolchain
        id: toolchain
        run: echo "id=$({ xcodebuild -version; swift --version; } 2>&1 | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Start from the last build kept
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: macos-debug-${{ steps.toolchain.outputs.id }}-${{ github.sha }}
          restore-keys: macos-debug-${{ steps.toolchain.outputs.id }}-
      - name: Date the sources by their content
        run: python3 -I scripts/source-times.py
      - name: Build
        run: |
          swift build --build-system native
          swift build --build-system native --build-tests
      - name: Keep the build
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: macos-debug-${{ steps.toolchain.outputs.id }}-${{ github.sha }}
