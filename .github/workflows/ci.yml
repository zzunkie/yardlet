name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    # Yardlet builds with Xcode 27.1 (Swift 6.4); Xcode 26 cannot compile it.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build --build-system native
      # `-v` keeps every test's XCTest output: its time and, when skipped, why. test-report.py shows
      # only the failed tests' output here and writes the rest to the run's summary and an artifact.
      - name: Test
        run: |
          set -o pipefail
          mkdir -p .build/ci
          ./scripts/test-fast.sh -v 2>&1 | python3 -I scripts/test-report.py --log .build/ci/test-output.log \
            --times .build/ci/test-times.tsv --summary "$GITHUB_STEP_SUMMARY"
      - name: Keep the test output and times
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            .build/ci/test-output.log
            .build/ci/test-times.tsv
          retention-days: 14
          if-no-files-found: ignore
      - name: Keep the images the tests drew
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-images
          path: |
            .build/*/*.png
            .build/*/*/*.png
            !.build/checkouts/**
            !.build/arm64-apple-macosx/**
            !.build/x86_64-apple-macosx/**
          retention-days: 14
          if-no-files-found: ignore
