name: CI

# Documents alone run nothing: no test reads them, and `main` requires no check for a pull request to
# wait on.
on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - '**/*.md'
      - LICENSE
  pull_request:
    paths-ignore:
      - docs/**
      - '**/*.md'
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request lands by fast-forwarding `main` to the commit its run tested, so building that commit
  # again here repeats the run. The same commit means the same tree: `main` never rewinds, so the commit
  # contains the `main` that run merged it with. Anything that reaches `main` another way (a merge button,
  # a rebase, a direct push) has a new SHA, finds no run and is built. With the build skipped the run
  # still passes, so the README's badge goes on saying whether `main` passed.
  tested-in-pull-request:
    name: Look for a passing pull request run
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.find.outputs.passed }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&status=success&head_sha=$GITHUB_SHA&per_page=1" --jq .total_count) || runs=0
          if [[ $runs -gt 0 ]]; then echo "passed=true" >> "$GITHUB_OUTPUT"; fi

  build-and-test:
    name: Build and test
    needs: tested-in-pull-request
    # `!cancelled()` lets this run when the job above is skipped, as on a pull request.
    if: ${{ !cancelled() && needs.tested-in-pull-request.outputs.passed != 'true' }}
    # Yardlet builds with Xcode 27.1 (Swift 6.4); Xcode 26 cannot compile it.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      # A compiler warning in a product target fails the run. The checkout is fresh, so this build
      # compiles every product file and prints its warnings; the test target is built by the step
      # after this one, and its warnings are not counted.
      - name: Build
        run: |
          set -o pipefail
          mkdir -p .build/ci
          swift build --build-system native 2>&1 | tee .build/ci/build.log
          ./scripts/product-warnings.sh .build/ci/build.log
      # `-v` keeps every test's XCTest output: its time and, when skipped, why. test-report.py shows
      # only the failed tests' output here and writes the rest to the run's summary and an artifact.
      - name: Test
        run: |
          set -o pipefail
          mkdir -p .build/ci
          ./scripts/test-fast.sh -v 2>&1 | python3 -I scripts/test-report.py --log .build/ci/test-output.log \
            --times .build/ci/test-times.tsv --summary "$GITHUB_STEP_SUMMARY"
      # While the eager stack can still be turned back on in place of the conversation's row list
      # (ConversationRowListSwitch), the conversation's tests run again with the stack, so a change that
      # breaks only the stack shows here. It goes away with the stack.
      - name: Test the conversation's stack
        run: |
          set -o pipefail
          ./scripts/test-conversation-stack.sh -v 2>&1 | python3 -I scripts/test-report.py \
            --log .build/ci/conversation-stack-output.log --times .build/ci/conversation-stack-times.tsv \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Keep the test output and times
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            .build/ci/test-output.log
            .build/ci/test-times.tsv
            .build/ci/conversation-stack-output.log
            .build/ci/conversation-stack-times.tsv
          retention-days: 14
          if-no-files-found: ignore
      - name: Keep the images the tests drew
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-images
          path: |
            .build/*/*.png
            .build/*/*/*.png
            !.build/checkouts/**
            !.build/arm64-apple-macosx/**
            !.build/x86_64-apple-macosx/**
          retention-days: 14
          if-no-files-found: ignore
